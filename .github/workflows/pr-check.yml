name: pr-check


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  checks: write # merge-check (reusable) reports a check run; without it the workflow fails at startup

jobs:
  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@fee0159b62f093b823407e01b52fc439607e2264

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@fee0159b62f093b823407e01b52fc439607e2264

  policy:
    uses: guilhermelinosp/templates/.github/workflows/pr-policy.yml@fee0159b62f093b823407e01b52fc439607e2264

  pr-gate:
    if: always()
    needs: [merge-check, gitleaks, policy]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')

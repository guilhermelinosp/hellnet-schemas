name: pr-check


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  id-token: write
  checks: write # merge-check (reusable) reports a check run; without it the workflow fails at startup

jobs:
  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@latest

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@latest

  policy:
    uses: guilhermelinosp/templates/.github/workflows/pr-policy.yml@latest

  registry:
    uses: guilhermelinosp/templates/.github/workflows/schema-sync.yml@latest
    with:
      mode: check

  pr-gate:
    if: always()
    needs: [merge-check, gitleaks, policy, registry]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')

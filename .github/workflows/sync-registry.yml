name: sync-registry

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "scripts/redpanda_registry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  apply:
    uses: ./.github/workflows/registry-sync.yml
    with:
      mode: apply
    secrets: inherit

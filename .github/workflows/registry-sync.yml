name: registry-sync

# Reusable: joins the private tailnet (no public endpoint) with a federated identity (OIDC, no secret) and talks to the Redpanda Schema Registry.
#   mode=check -> read-only compatibility test (pull requests)
#   mode=apply -> sets compatibility and registers schemas (merge to main)
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  REGISTRY_HOST: schema.hellnet.com.br
  REGISTRY_IP: 192.168.1.2

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-schema-tools

      - name: Check credentials
        id: creds
        env:
          CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
          AUDIENCE: ${{ vars.TS_AUDIENCE }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$AUDIENCE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.mode }}" = apply ]; then
              echo "::error::variables TS_CLIENT_ID / TS_AUDIENCE are not configured; the Registry was NOT synced"
              exit 1
            fi
            echo "::notice::No Tailscale identity in this context (fork or Dependabot); Registry check skipped"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet
        if: steps.creds.outputs.present == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github
          use-cache: "true"

      - name: Resolve the Registry over the tailnet
        if: steps.creds.outputs.present == 'true'
        run: echo "$REGISTRY_IP $REGISTRY_HOST" | sudo tee -a /etc/hosts >/dev/null

      - name: ${{ inputs.mode }} schemas against Redpanda
        if: steps.creds.outputs.present == 'true'
        run: python3 scripts/redpanda_registry.py "${{ inputs.mode }}" --registry "https://$REGISTRY_HOST"

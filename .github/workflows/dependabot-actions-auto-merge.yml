name: dependabot-actions-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/')
    uses: guilhermelinosp/templates/.github/workflows/dependabot-auto-merge.yml@fee0159b62f093b823407e01b52fc439607e2264
